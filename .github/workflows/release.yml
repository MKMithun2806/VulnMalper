name: Release

on:
  push:
    branches: [main]
    paths:
      - "vulnmalper.py"
      - "build_deb.sh"
      - "build_alpine.sh"
      - "build_exe.ps1"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Extract version from vulnmalper.py
        id: version
        run: |
          VERSION="$(python3 -c 'import re; print(re.search(r"VERSION\s*=\s*\"([0-9.]+)\"", open("vulnmalper.py").read()).group(1))')"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          chmod +x build_deb.sh
          if ! ./build_deb.sh "$VERSION"; then
            echo ">> direct build failed; retrying as root inside a Debian container..."
            mkdir -p dist && chmod 777 dist
            docker run --rm -v "$PWD":/work -w /work \
              debian:bookworm-slim \
              bash -c "apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq dpkg-dev >/dev/null 2>&1 && bash build_deb.sh '$VERSION'"
          fi
          ls -lh dist/vulnmalper_${VERSION}_all.deb

      - name: Build Python distributions
        run: uv build

      - name: Build Alpine (musl) binary
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            alpine:3.21 \
            sh -c "apk add --no-cache python3 py3-pip gcc musl-dev python3-dev binutils curl ca-certificates >/dev/null 2>&1 && sh build_alpine.sh ${{ steps.version.outputs.VERSION }}"

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          NOTES="Automated build from commit \`${{ github.sha }}\`. Regenerated automatically whenever vulnmalper.py changes."
          FILES=(
            "dist/vulnmalper_${VERSION}_all.deb"
            "dist/vulnmalper-${VERSION}-py3-none-any.whl"
            "dist/vulnmalper-${VERSION}.tar.gz"
            "dist/vulnmalper-v${VERSION}-alpine-musl"
          )
          CREATED=0
          for i in 1 2 3; do
            if gh release create "$TAG" "${FILES[@]}" \
              --title "VulnMalper ${TAG}" \
              --notes "$NOTES"; then
              CREATED=1
              break
            fi
            echo "release creation attempt ${i} failed, retrying in 5s..."
            sleep 5
          done
          [ "$CREATED" = "1" ] || { echo "failed to create release"; exit 1; }
