[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnmalper"
description = "Vulnerability pipeline for NetMalper graphs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "VulnMalper contributors" },
]
keywords = [
    "security",
    "vulnerability",
    "scanner",
    "pentest",
    "red-team",
    "nuclei",
    "sqlmap",
    "nikto",
    "wapiti",
    "httpx",
    "netmalper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/MKMithun2806/VulnMalper"
Repository = "https://github.com/MKMithun2806/VulnMalper"
Documentation = "https://github.com/MKMithun2806/VulnMalper/blob/main/README.md"
Issues = "https://github.com/MKMithun2806/VulnMalper/issues"
Changelog = "https://github.com/MKMithun2806/VulnMalper/blob/main/CHANGELOG.md"

[project.scripts]
vulnmalper = "vulnmalper:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.2",
]

[tool.hatch.version]
path = "vulnmalper.py"
pattern = "VERSION\\s*=\\s*['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
include = ["vulnmalper.py"]

[tool.hatch.build.targets.sdist]
include = [
    "vulnmalper.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "tests/",
    "examples/",
    "docs/",
    "build_deb.sh",
    "build_exe.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
# vulnmalper.py is a legacy single-file program kept byte-for-byte intact.
# New code (tests, scripts) is linted; the application itself is not touched.
extend-exclude = ["vulnmalper.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
